name: ChartNova
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_ASSET_PATHS: ""
targets:
  ChartNova:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChartNova
        CFBundleURLTypes:
          - CFBundleURLName: ir.chartnova.ios
            CFBundleURLSchemes: [chartnova]
        UIUserInterfaceStyle: Automatic
    entitlements:
      path: App/ChartNova.entitlements
      properties:
        com.apple.security.application-groups: [group.ir.chartnova.widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.chartnova.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    dependencies:
      - target: ChartNovaWidgets
        embed: true
  ChartNovaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: ChartNova Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetExtension/ChartNovaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ir.chartnova.widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.chartnova.ios.widgets
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
  ChartNovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ChartNova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.chartnova.ios.tests
schemes:
  ChartNova:
    build:
      targets:
        ChartNova: all
        ChartNovaWidgets: all
    test:
      targets:
        - ChartNovaTests
    run:
      config: Debug
