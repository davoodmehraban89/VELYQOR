name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  postgres-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velyqor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d velyqor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply PostgreSQL migrations
        run: |
          for file in db/migrations/*.sql; do
            psql -h localhost -U postgres -d velyqor_test -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Execute persistence invariants
        run: |
          for file in db/tests/*.sql; do
            psql -h localhost -U postgres -d velyqor_test -v ON_ERROR_STOP=1 -f "$file"
          done
