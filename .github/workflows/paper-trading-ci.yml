name: Paper Trading - Safe Simulation CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify paper position unit tests
        run: node --test packages/market-domain/test/paper-position.test.mjs
      - name: Guard pure module against broker/network imports
        shell: bash
        run: |
          if grep -Ein '(from|import).*([@/](ccxt|broker|exchange|trading|ethers|web3)|node:(http|https|net|child_process))|\b(fetch|WebSocket|XMLHttpRequest|placeOrder|submitOrder|executeOrder)\s*\(' packages/market-domain/src/paper-position.mjs; then
            echo "Paper-position module unexpectedly calls networking/broker APIs." >&2
            exit 1
          fi
      - name: Install standalone terminal dependencies
        working-directory: apps/market-terminal
        run: npm ci --no-audit --no-fund
      - name: Build Vite terminal with paper panel
        working-directory: apps/market-terminal
        run: npm run build
