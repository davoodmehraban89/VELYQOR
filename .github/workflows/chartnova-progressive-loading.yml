name: ChartNova progressive loading safety
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  optimize-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit test fail-closed Worker bootstrap patch
        run: node --test scripts/optimize-chartnova-worker.test.mjs
      - name: Install diagnostic browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Compare staged candidate to current production in mobile Chromium
        run: node scripts/check-chartnova-staged-performance.mjs
