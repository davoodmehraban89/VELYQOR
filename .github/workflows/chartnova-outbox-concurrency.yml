name: ChartNova atomic outbox concurrency test
on:
  pull_request:
    paths:
      - 'db/migrations/0004_notification_outbox.sql'
      - 'db/tests/notification_outbox_invariants.sql'
      - 'scripts/check-outbox-concurrency.mjs'
      - 'docs/operations/chartnova-atomic-outbox-2026-10-22.md'
      - 'PROJECT_STATE.md'
      - '.github/workflows/chartnova-outbox-concurrency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-real-postgres-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velyqor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d velyqor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: velyqor_test
      VELYQOR_TEST_DATABASE: velyqor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migrations to disposable local CI database ONLY
        run: |
          for file in db/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
      - name: Test concurrent enqueue and locked-row claim without touching Neon
        run: node scripts/check-outbox-concurrency.mjs
